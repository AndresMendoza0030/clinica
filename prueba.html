<!DOCTYPE html>
<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Estudios | Clínica Dr. Mendoza</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#c70505",
              "background-light": "#fcf8f8",
              "background-dark": "#230f0f",
            },
            fontFamily: {
              display: ["Public Sans", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              "2xl": "1rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-background-light dark:bg-background-dark text-[#1c0d0d] dark:text-[#f4e6e6] font-display overflow-x-hidden">
    <div id="site-header"></div>

    <main>
      <!-- AQUÍ SOLO CAMBIAS EL CUERPO -->
      <section class="py-16 px-4 md:px-10">
        <div class="max-w-[1280px] mx-auto">
          <h1 class="text-3xl font-black">Contenido de esta página</h1>
          <p class="mt-4 text-[#634f4f]">
            Aquí solo cambias el cuerpo sin volver a copiar header, sedes, footer y WhatsApp.
          </p>
        </div>
      </section>
    </main>

    <div id="site-sedes"></div>
    <div id="site-footer"></div>
    <div id="site-whatsapp"></div>

    <script src="scripts/layout.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{{TITLE}}</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#c70505",
              "background-light": "#fcf8f8",
              "background-dark": "#230f0f",
            },
            fontFamily: {
              display: ["Public Sans", "sans-serif"],
            },
            borderRadius: {
              lg: "0.5rem",
              xl: "0.75rem",
              "2xl": "1rem",
              full: "9999px",
            },
          },
        },
      };
    </script>

    <style>
      html { scroll-behavior: smooth; }
      .line-clamp-3 {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>

  <body class="bg-background-light dark:bg-background-dark text-[#1c0d0d] dark:text-[#f4e6e6] font-display overflow-x-hidden">
    <!-- HEADER -->
    <header class="sticky top-0 z-50 w-full border-b border-[#f4e6e6] bg-[#fcf8f8]/95 backdrop-blur-sm dark:bg-[#1c0d0d]/95 dark:border-[#331f1f]">
      <div class="flex h-16 items-center justify-between px-4 md:px-10 max-w-[1280px] mx-auto">
        <a class="flex items-center" href="index.html" aria-label="Ir al inicio">
          <img
            src="https://lwjusnpkibgoxkcvrvww.supabase.co/storage/v1/object/public/ClinicaIMG/LogoDrMendoza3.png"
            alt="Logo Clínica Dr. Mendoza"
            class="h-12 md:h-14 w-auto object-contain"
          />
        </a>

        <nav class="hidden md:flex flex-1 items-center justify-end gap-8">
          <a class="text-sm font-medium hover:text-primary transition-colors" href="index.html#inicio">Inicio</a>
          <a class="text-sm font-medium hover:text-primary transition-colors" href="estudios.html">Estudios</a>
          <a class="text-sm font-medium hover:text-primary transition-colors" href="index.html#laboratorio">Laboratorio clínico</a>
          <a class="text-sm font-medium hover:text-primary transition-colors" href="index.html#sedes">Sedes y contacto</a>
          <a class="text-sm font-medium hover:text-primary transition-colors" href="index.html#institucional">Historia</a>
        </nav>

        <button class="md:hidden p-2 text-[#1c0d0d] dark:text-white" aria-label="Abrir menú">
          <span class="material-symbols-outlined">menu</span>
        </button>
      </div>
    </header>

    <!-- CONTENIDO -->
    <main>
      {{CONTENT}}
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#1c0d0d] text-white pt-12 pb-8">
      <div class="max-w-[1280px] mx-auto px-4 md:px-10">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-gray-500 border-t border-gray-800 pt-8">
          <p>© 2026 Clínica Radiológica y Laboratorio Clínico Dr. Mendoza. Todos los derechos reservados.</p>
          <div class="flex gap-6">
            <a class="hover:text-white transition-colors" href="#">Aviso de Privacidad</a>
            <a class="hover:text-white transition-colors" href="#">Términos y Condiciones</a>
          </div>
        </div>
      </div>
    </footer>

    <!-- WhatsApp flotante -->
    <a
      aria-label="Consultas por WhatsApp"
      class="fixed bottom-6 right-6 bg-[#25D366] text-white p-3 rounded-full shadow-xl hover:scale-110 transition-transform z-50 flex items-center justify-center"
      href="https://wa.me/50378205613"
      target="_blank"
      rel="noopener"
    >
      <span class="material-symbols-outlined text-3xl">chat</span>
    </a>
  </body>
</html>

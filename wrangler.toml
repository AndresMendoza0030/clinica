name = "clinica"
main = "worker.js"
compatibility_date = "2026-03-18"

[assets]
directory = "./public"

# Luna is independent of any employee-management credentials.
[vars]
LUNA_PATIENTS_ENABLED = "false"
# Set LUNA_PATIENTS_MODEL explicitly only after validating account access.

[[durable_objects.bindings]]
name = "LUNA_PATIENTS_BUDGET"
class_name = "LunaBudget"

[[migrations]]
tag = "luna-budget-v1"
new_sqlite_classes = ["LunaBudget"]

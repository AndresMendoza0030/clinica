        <path d="M47 205c-3 0-6 2-9 5-2 3 1 5 3 4l9-5m8-5c3 0 6 1 10-2 3-3 6-1 5 1-1 4-7 7-12 7" fill="#c98d5c" stroke="#774a36" stroke-width="1.8"/>
        <path d="M36.9 211.6q1.2 4.5 5.2 2l.9-2.5-2.4-1.5zM68 202q2-3 5-1.6l.8 1.6q-.8 2.2-3.6 3z" fill="#664638"/>
        <g class="pf-face">
          <g fill="none" stroke="#946741" stroke-width="4.2">

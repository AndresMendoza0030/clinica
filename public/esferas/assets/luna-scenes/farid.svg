        <path d="M48 228q-8-7-13-6m19 4q5-5 5-9" fill="none" stroke="#eac990" stroke-width="1.5"/>
        <ellipse cx="51" cy="229" rx="4" ry="3.7" fill="#e1b76f" stroke="#865d3d" stroke-width="1.2"/>
        <g class="pf-underside">
          <path d="m13 234 27-16 50 12-28 17z" fill="#9f5650" stroke="#693735" stroke-width="2"/>
          <path d="m18 234 23-12 43 9-23 12z" fill="#d8a271" stroke="#b37655" stroke-width="1.35"/>
          <path d="m22 234 20-10 27 6m-33 7 25 6" fill="none" stroke="#edc799" stroke-width="1.2"/>
        </g>
      </g></g>
    </g>

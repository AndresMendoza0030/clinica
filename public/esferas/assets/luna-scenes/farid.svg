<svg xmlns="http://www.w3.org/2000/svg" id="pf-scene" viewBox="0 0 320 320" width="320" height="320" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="pf-paper" x2=".77" y2="1"><stop stop-color="#de5552"/><stop offset=".51" stop-color="#ab303a"/><stop offset="1" stop-color="#822834"/></linearGradient>
    <linearGradient id="pf-pine" x2=".8" y2="1"><stop stop-color="#497e70"/><stop offset=".48" stop-color="#286259"/><stop offset="1" stop-color="#204742"/></linearGradient>
    <linearGradient id="pf-fur" x2=".73" y2=".93"><stop stop-color="#efc58c"/><stop offset=".56" stop-color="#d79b64"/><stop offset="1" stop-color="#aa6a43"/></linearGradient>
    <radialGradient id="pf-nose" cx=".34" cy=".26" r=".81"><stop stop-color="#ffb790"/><stop offset=".35" stop-color="#ed655c"/><stop offset="1" stop-color="#aa343a"/></radialGradient>
    <clipPath id="pf-peek"><path d="M1 116h98v116l-38 17-45-9H1z"/></clipPath>
  </defs>
  <style>
    #pf-scene .pf-parcel { transform-origin: 50px 273px; }
    #pf-scene .pf-lid { transform: scaleY(-1.15) skewX(-31deg); }
    #pf-scene .pf-underside { opacity: 1; }
    #pf-scene .pf-coil { transform-origin: 50px 238px; }
    #pf-scene .pf-face { transform-origin: 49px 202px; transform: rotate(-7deg); }
    #pf-scene .pf-glance { transform: translate(1px,-1px); }
    @media (prefers-reduced-motion: no-preference) {
      #pf-scene .pf-parcel { animation: pf-rattle 4.8s ease-in-out both; }
      #pf-scene .pf-lid { animation: pf-open 4.8s ease-in-out both; }
      #pf-scene .pf-underside { animation: pf-reverse 4.8s steps(1,end) both; }
      #pf-scene .pf-reveal { animation: pf-peek-in 4.8s ease-out both; }
      #pf-scene .pf-puppet { animation: pf-pop 4.8s ease-in-out both; }
      #pf-scene .pf-coil { animation: pf-spring 4.8s ease-in-out both; }
      #pf-scene .pf-face { animation: pf-tilt 4.8s ease-in-out both; }
      #pf-scene .pf-glance { animation: pf-look 4.8s ease-in-out both; }
    }
    @keyframes pf-rattle {
      0%, 12%, 17%, 27%, 32%, 56%, 100% { transform: rotate(0); }
      5% { transform: rotate(-4deg); } 9% { transform: rotate(2deg); }
      21% { transform: rotate(5deg); } 24% { transform: rotate(-2.5deg); }
      45% { transform: rotate(-1.8deg); } 50% { transform: rotate(1deg); }
    }
    @keyframes pf-open {
      0%, 28% { transform: scaleY(1) skewX(0); }
      32% { transform: scaleY(.72) skewX(-2deg); }
      34% { transform: scaleY(.91) skewX(-1deg); }
      39% { transform: scaleY(.02) skewX(-13deg); }
      45% { transform: scaleY(-1.26) skewX(-36deg); }
      53% { transform: scaleY(-1.06) skewX(-28deg); }
      61%, 100% { transform: scaleY(-1.15) skewX(-31deg); }
    }
    @keyframes pf-reverse { 0% { opacity: 0; } 39%, 100% { opacity: 1; } }
    @keyframes pf-peek-in { 0%, 37% { opacity: 0; } 40%, 100% { opacity: 1; } }
    @keyframes pf-pop {
      0%, 38% { transform: translate(0,101px); } 42% { transform: translate(0,79px); }
      53% { transform: translate(0,-8px); } 60% { transform: translate(0,5px); }
      68% { transform: translate(0,-2px); } 75%, 100% { transform: translate(0,0); }
    }
    @keyframes pf-spring {
      0%, 40% { transform: scaleY(.06); } 46% { transform: scaleY(.2); }
      53% { transform: scaleY(1.32); } 60% { transform: scaleY(.8); }
      68% { transform: scaleY(1.08); } 75%, 100% { transform: scaleY(1); }
    }
    @keyframes pf-tilt {
      0%, 47% { transform: rotate(6deg); } 54% { transform: rotate(-3deg); }
      63%, 69% { transform: rotate(3deg); } 81%, 100% { transform: rotate(-7deg); }
    }
    @keyframes pf-look { 0%, 68% { transform: translate(-.7px,.8px); } 77%,100% { transform: translate(1px,-1px); } }
  </style>

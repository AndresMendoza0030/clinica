        <path d="M51 239c-4-3-13-4-11-8 2-3 20-2 20-6 1-3-22-4-20-9 1-3 17-1 17-5" stroke="#e5ba70" stroke-width="2"/>
        <path d="m45 230 9-2m-5-12 5-1" stroke="#fff1ba" stroke-width="1.2"/>
      </g>
      <g class="pf-puppet">

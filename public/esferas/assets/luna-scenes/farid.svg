            <ellipse cx="52.7" cy="180.8" rx="2.7" ry="3.45"/><ellipse cx="64.8" cy="178.2" rx="2.4" ry="3.05"/>
            <path d="M52.8 179.6h.2m11.7-2.3h.2" stroke="#fff4d9" stroke-width="1.35"/>
          </g>
          <path d="M48 174q3-3 5.5-2m7.5-2q2.5-2.1 5.1-.4" fill="none" stroke="#865338" stroke-width="1.65"/>
          <ellipse cx="73.4" cy="183.6" rx="6.35" ry="5.45" transform="rotate(-15 73.4 183.6)" fill="url(#pf-nose)" stroke="#873b39" stroke-width="1.6"/>
          <ellipse cx="72.2" cy="181.8" rx="1.8" ry="1" fill="#ffddc2"/>
          <path d="M41 196q10 7 20 2c2 0 3 4 1 6-9 5-18 3-24-2-2-2 0-5 3-6z" fill="url(#pf-pine)" stroke="#355446" stroke-width="1.7"/>
          <path d="M43 203c-2 4-5 7-8 9l3 2 2 3q7-4 9-11z" fill="url(#pf-pine)" stroke="#355446" stroke-width="1.6"/>
          <path d="m40 201 3-3m6 7 2-3m-12 8 4 3" fill="none" stroke="#f3c781" stroke-width="1.5"/>
          <circle cx="60.5" cy="205.4" r="2.85" fill="#deb268" stroke="#8d673e" stroke-width="1"/>

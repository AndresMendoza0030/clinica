<svg xmlns="http://www.w3.org/2000/svg" class="ar-scene" viewBox="0 0 320 320" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ar-brass" x1=".12" y1="0" x2=".85" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff0a9"/><stop offset=".25" stop-color="#c78548"/>
      <stop offset=".53" stop-color="#f4ce85"/><stop offset="1" stop-color="#a96239"/>
    </linearGradient>
    <linearGradient id="ar-film" x1="0" y1="0" x2=".92" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#153750"/><stop offset=".48" stop-color="#24485b"/><stop offset="1" stop-color="#0b223c"/>
    </linearGradient>
    <linearGradient id="ar-biscuit" x1="0" y1="0" x2=".45" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#95c4bd"/><stop offset=".38" stop-color="#56899a"/><stop offset="1" stop-color="#396d86"/>
    </linearGradient>
    <linearGradient id="ar-light" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#caebe7" stop-opacity="0"/><stop offset=".48" stop-color="#c0ece6" stop-opacity=".14"/>
      <stop offset=".77" stop-color="#fff1c3" stop-opacity=".56"/><stop offset="1" stop-color="#baf4ee" stop-opacity="0"/>
    </linearGradient>
    <!-- The edge follows the top of the right-hand stack of pages. -->
    <clipPath id="ar-pages"><path d="M0 0h320v219l-51-1-7-5-11-3q-35-2-71 16l-24 16Q93 203 52 215L0 226Z"/></clipPath>
    <clipPath id="ar-plate"><path d="M5 4.9 55.4 4q2.2 0 2.2 2.2L57 72.4q0 2.4-2.5 2.4L5.1 75q-2 0-2-2.3l.2-66q0-1.8 1.7-1.8Z"/></clipPath>
  </defs>
  <style>
    .ar-scene .ar-lift {transform-box:view-box;transform-origin:229px 216px;transform:rotate(7deg)}
    .ar-scene .ar-exposure {opacity:1}
    .ar-scene .ar-scan,.ar-scene .ar-glint {opacity:0}
    @media (prefers-reduced-motion:no-preference) {
      .ar-scene .ar-lift {animation:ar-slip 4.8s ease-in-out 1 both}
      .ar-scene .ar-exposure {animation:ar-develop 4.8s ease-in-out 1 both}
      .ar-scene .ar-scan {animation:ar-read 4.8s linear 1 both}
      .ar-scene .ar-glint {animation:ar-wink 4.8s ease-in-out 1 both;transform-box:fill-box;transform-origin:center}
    }
    @keyframes ar-slip {
      0% {transform:translate(-10px,56px) rotate(-9deg)}
      9% {transform:translate(-7px,43px) rotate(-5deg)}
      26% {transform:translate(1px,-2px) rotate(10deg)}
      38%,100% {transform:rotate(7deg)}
    }
    @keyframes ar-read {
      0%,24% {opacity:0;transform:translateY(-15px)}
      28% {opacity:1;transform:translateY(-9px)}
      51% {opacity:1;transform:translateY(74px)}
      55%,100% {opacity:0;transform:translateY(83px)}
    }
    @keyframes ar-develop {
      0%,28% {opacity:.12}
      38% {opacity:.58}
      45%,100% {opacity:1}
    }
    @keyframes ar-wink {
      0%,55% {opacity:0;transform:scale(.42)}
      62% {opacity:.94;transform:scale(1)}
      68% {opacity:.48;transform:scale(.77)}
      78%,100% {opacity:.20;transform:scale(.52)}
    }
    @media (prefers-reduced-motion:reduce) {
      .ar-scene .ar-glint {opacity:.63}
    }
  </style>
  <g clip-path="url(#ar-pages)">
    <g class="ar-lift">
      <g transform="translate(204 146)" stroke-linejoin="round" stroke-linecap="round">
        <!-- A folded brass rim catches light on the upper and left edges. -->
        <path d="m4.4 1.8 51.7-.9q4 0 4 4l-.4 69.8q0 3.5-3.8 3.6l-51.8.8q-4 .1-4-3.8L0 6.2q0-3.9 4.4-4.4Z" fill="url(#ar-brass)" stroke="#5c452f" stroke-width="1.8"/>
        <path d="m3.3 13 .1-7.3q.1-2 2.6-2.1l12.8-.3" fill="none" stroke="#fff1b6" stroke-width="1.15"/>
        <g clip-path="url(#ar-plate)">
          <path d="M2 3h57v74H2z" fill="url(#ar-film)"/>
          <path d="M1 14 29 4h11L2 20zM36 75l23-10v4l-16 7z" fill="#b5e0da" opacity=".09"/>
          <path d="M13 9H9v4m39-4h4v4M9 62v4h4m35 0h4v-4" stroke="#a3b8b2" opacity=".65" fill="none" stroke-width=".9"/>
          <g class="ar-exposure">
            <!-- The biscuit keeps its rounded silhouette even on a small screen. -->
            <path d="M22.2 32.8a9.6 9.6 0 1 1 10.2-.2q3 .4 4.7-.8l5.1-4q3.4-2.1 5.8.9 2.2 3.2-.8 6.1l-7.5 6.7q-1.9 1.4-4.2 1.8l.1 4.2 5.8 9.1q2.4 4.3-1.2 6.8-3.6 2.3-6.3-1l-6.1-7.3-5.5 7.6q-2.8 3.8-6.9 1.1-3-2.2-.9-6.2l5.2-9.5-.2-4.9-6.7 2q-4.8 1.5-6.2-2.4-1.2-3.6 2.8-5.5l8.2-3.4q2.2-1 4.6-1.1Z" fill="url(#ar-biscuit)" stroke="#162e44" stroke-width="2.9"/>
            <path d="M19.1 23.8a8.9 8.9 0 0 1 15.2-6.1M8.5 40.1l9.8-4.3M35.2 61l2 2" stroke="#c1e5d4" stroke-width="1" opacity=".72" fill="none"/>
            <!-- Skull and icing face, a scalloped collar, paired ribs and little joint bones. -->
            <path d="M21.3 23.2c.1-7.5 12.8-7.9 12.8-.2.1 2-1.1 3.1-3 4.3l-.6 2.1q-2.5 2-5.6.3l-.7-2.2c-1.9-.8-3-2.2-2.9-4.3Z" fill="#f8ead0"/>
            <g fill="#2b5365"><ellipse cx="25.1" cy="23" rx="1.25" ry="1.55"/><ellipse cx="30.8" cy="22.8" rx="1.25" ry="1.55"/><path d="m26.9 26 1-1.6 1.1 1.6Z"/></g>
            <g stroke="#f3ebce" fill="none">
              <path d="m23.2 34.5 4.2 2.2 4.4-2.4m-4.3.2.4 13.4M22.9 39q4.7 3.7 9.2-.4m-9.1 4q4.6 3.6 9.1-.4" stroke-width="1.8"/>
              <path d="m22.9 48.1 4.8 3.2 4.7-3.3m-9.2 5.3-5.2 7.3m13.9-7.5 5.3 7.1M19 38.8l-6.6 2.8m24.5-4.9 6.2-5" stroke-width="2.3"/>
              <path d="m15.7 59.7 1.5 1.5 1.7-.2 1 1.2m14.8-.7 1.4-1.5 1.5.4 1.4-1.3M11 39l1.4 1.7-.5 1.3 1.1 1.4" stroke-width="1"/>
            </g>
            <path d="m27.4 32.7-3.9-1.6q-1.1-.4-1.1.8l.2 3.4q0 .9 1 .6l3.9-1.5 3.8 1.5q1.1.4 1.1-.7l-.2-3.5q0-1-1-.6Z" fill="#d07466" stroke="#6f4241" stroke-width=".8"/>
            <circle cx="27.6" cy="33.5" r="1.2" fill="#ffcf9c"/>
            <!-- The candy cane echoes the sugar stripes on the reader's companion. -->
            <path d="m45 34 2.3-13c.9-4.2-4.7-5.4-5.6-1.2l-.3 1.5" stroke="#214054" stroke-width="4.9" fill="none"/>
            <path d="m45 34 2.3-13c.9-4.2-4.7-5.4-5.6-1.2l-.3 1.5" stroke="#fff0cc" stroke-width="3.7" fill="none"/>
            <path d="m44 30.2 2.4 1.1m-1.5-5.5 2.4 1.1m-1.6-5.4 2 .9M44 17.8l1 2M41 20l1.9.3" stroke="#b75346" stroke-width="1.45" fill="none"/>
          </g>
          <path d="M8 70.2h8.1m1.8 0h2.3m22.6-.5 6.2-.1" stroke="#c8b783" opacity=".82" fill="none" stroke-width="1"/>
          <path class="ar-scan" d="M-7 0 65-13v20L-7 20Z" fill="url(#ar-light)"/>
        </g>
        <path class="ar-glint" d="m54.7 1.7 1.4 4.6 4.8 1.2-4.7 1.2-1.4 4.9-1.3-4.9-4.6-1.2 4.6-1.2Z" fill="#fff2b6"/>
      </g>
    </g>
  </g>
</svg>

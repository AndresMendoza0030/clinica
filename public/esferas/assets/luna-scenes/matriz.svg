<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="mx-scene" width="320" height="320" viewBox="0 0 320 320" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="mx-paper" x1="0" x2="1" y1="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#98b27e"/><stop offset=".53" stop-color="#56886e"/><stop offset="1" stop-color="#356957"/>
    </linearGradient>
    <linearGradient id="mx-fold" x1="0" x2="1" y1="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#39735e"/><stop offset="1" stop-color="#214c44"/>
    </linearGradient>
    <pattern id="mx-fibres" patternUnits="userSpaceOnUse" width="14" height="14">
      <path d="m1 4 3-1m5 7 2-.8m-7 .9 1-.4" fill="none" stroke="#f0dba3" stroke-width=".65" stroke-linecap="round" opacity=".42"/>
      <path d="m8 5 1.6-.5m-7 7 1-.5" fill="none" stroke="#233f35" stroke-width=".7" stroke-linecap="round" opacity=".55"/>
    </pattern>
    <path id="mx-skirt" d="M0-31Q-9-16-32-.8l10-.2-2.4 3.6 13.6-3.3L-.2 4.5 13 1.1l10.4 2.5-1.3-3.4 10.7 1.1Q12-12 0-31Z"/>
    <path id="mx-waist" d="M0-27Q-7.6-15.2-23.7-1l7.5-1.1-2.1 4L-8.8-.6.4 3.4l9.1-3.8 9.4 2.6-1.2-3.1 7.2.7Q11-12.2 0-27Z"/>
    <path id="mx-crown-shape" d="M-.5-24Q-4-16.2-8.1-10.1l2.7-.3Q-9.1-5.2-15-.7l6.6-.6-1.5 2.4 9.2-2 6.5 2.6-.7-2.3 8.9.8Q9.2-5.2 5.4-11l2.9.7Q3.7-16.7-.5-24Z"/>
    <g id="mx-bauble">
      <path d="M0-3.1v1.5" stroke="#e6c475" stroke-width="1"/>
      <circle r="2.4" cy=".8" fill="#be4845" stroke="#713838" stroke-width=".8"/>
      <path d="m-1-.1.8-.5" stroke="#ffe1a4" stroke-width=".9" stroke-linecap="round"/>
    </g>
    <path id="mx-star-shape" d="m0-9.2 2.6 5.8 6.4.8-4.7 4.5 1.1 6.4L0 5.2l-5.6 3 1-6.3-4.6-4.5 6.3-.9Z"/>
  </defs>
  <style>
    .mx-scene { pointer-events: none; }
    .mx-scene .mx-cycle { animation-duration: 4.8s; animation-iteration-count: 1; animation-fill-mode: both; animation-timing-function: ease-in-out; transform-origin: 0 0; }
    .mx-scene .mx-shade { animation-name: mx-shade; }
    .mx-scene .mx-lower { animation-name: mx-lower; }
    .mx-scene .mx-middle { animation-name: mx-middle; }
    .mx-scene .mx-upper { animation-name: mx-upper; }
    .mx-scene .mx-tumble { animation-name: mx-tumble; }
    .mx-scene .mx-warm { animation-name: mx-warm; }
    .mx-scene .mx-flash { animation-name: mx-flash; }
    @keyframes mx-shade { 0%,4% { opacity: .28; transform: scaleX(.5); } 28%,100% { opacity: 1; transform: scaleX(1); } }
    @keyframes mx-lower {
      0%,3% { transform: translateY(1px) rotate(-8deg) scale(1.03,.045); }
      9% { transform: rotate(-4deg) scale(1.03,.13); }
      24% { transform: rotate(2.5deg) scale(.99,1.035); }
      31%,56% { transform: none; }
      64% { transform: rotate(2.2deg) scale(1,.986); }
      70% { transform: rotate(-1deg); }
      77%,100% { transform: none; }
    }
    @keyframes mx-middle {
      0%,14% { opacity: 0; transform: rotate(7deg) scale(1.06,.07); }
      19% { opacity: 1; transform: rotate(4deg) scale(1.06,.13); }
      34% { opacity: 1; transform: rotate(-3deg) scale(.98,1.04); }
      42%,100% { opacity: 1; transform: none; }
    }
    @keyframes mx-upper {
      0%,25% { opacity: 0; transform: rotate(-13deg) scale(1.06,.07); }
      30% { opacity: 1; transform: rotate(-9deg) scale(1.06,.14); }
      44% { opacity: 1; transform: rotate(4deg) scale(.98,1.035); }
      52%,100% { opacity: 1; transform: none; }
    }
    @keyframes mx-tumble {
      0%,34% { opacity: 0; transform: translate(29px,10px) rotate(104deg) scale(.22); }
      41% { opacity: 1; transform: translate(25px,2px) rotate(85deg) scale(.8); }
      50% { opacity: 1; transform: translate(15px,-8px) rotate(48deg) scale(1); }
      61% { opacity: 1; transform: translate(1px,1.6px) rotate(-13deg) scale(1,.93); }
      66% { transform: translate(-2px,-2.4px) rotate(9deg); }
      72% { transform: translate(0,.4px) rotate(-4deg); }
      78%,100% { opacity: 1; transform: none; }
    }
    @keyframes mx-warm { 0%,61% { opacity: 0; } 69% { opacity: .85; } 79%,100% { opacity: .65; } }
    @keyframes mx-flash { 0%,61% { opacity: 0; transform: scale(.55); } 69% { opacity: .95; transform: scale(1); } 79%,100% { opacity: 0; transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) {
      .mx-scene .mx-cycle { animation: none; }
      .mx-scene .mx-warm { opacity: .65; }
      .mx-scene .mx-flash { opacity: 0; }
    }
  </style>
  <!-- Two pasted paper feet anchor the pop-up beside the gutter. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="m163.8 240.9 16.4-9.5 16.2-1.3-13 8.2-8.4-1.5Z" fill="#886134" opacity=".29"/>
    <path d="m164.5 239.2 13.6-8.7 8.7-.3-8 6.1-4.6-.2Z" fill="#e8c38b" stroke="#946d46" stroke-width=".9"/>
    <path d="m180 236.4 8.7-7.6 9.6.1-10.2 6.4Z" fill="#f8dfab" stroke="#946d46" stroke-width=".85"/>
    <path d="m181.8 234.6 5.4-4.2m-19.7 6.8 7.8-4.8" stroke="#fff0c4" fill="none" stroke-width="1.05"/>
    <g>
      <g transform="translate(182 233.6)">
        <g class="mx-cycle mx-shade">
          <path d="M-23 3.6Q-14-.6 5-3.5l21-1.6Q11 1.6-7 4.8Z" fill="#65452d" opacity=".28"/>
          <path d="M-4-.1.2-4l4.9.4L3 1.8l-4.6 1.3Z" fill="#a56b44" stroke="#67462f" stroke-width=".9"/>
        </g>
        <g class="mx-cycle mx-lower">
          <use xlink:href="#mx-skirt" fill="url(#mx-paper)" stroke="#2c4940" stroke-width="2.1"/>
          <path d="M0-30.5-.2 4.1 13 .8l10.1 2.6-1.4-3.6L32 1Q11.5-12.7 0-30.5Z" fill="url(#mx-fold)"/>
          <path d="m-31.4-.8 9.2-.3-1.9 3.2 13.2-3.4L-.2 3.8 13 .4l9.9 2.7-1.2-3.6L32 1" fill="none" stroke="#d3b775" stroke-width="1.4"/>
          <path d="m-.4-26.5-.4 26.8m-3.3-14.9L-16.9-2.8m7.9-4.7-12 3.8m24.6-13.2 12 12.3" fill="none" stroke="#a4b08b" stroke-width=".75" opacity=".75"/>
          <use xlink:href="#mx-skirt" fill="url(#mx-fibres)"/>
          <path d="M-22.1-6.3q9.1 4.9 18.4 1.4 10-3.5 18.1-6.9" fill="none" stroke="#e5bc70" stroke-width="1.25"/>
          <use xlink:href="#mx-bauble" x="-17.2" y="-3.6"/><use xlink:href="#mx-bauble" x="8.5" y="-7.9"/>
          <circle cx="-5.4" cy="-1.7" r="1.5" fill="#e9bc65" stroke="#725834" stroke-width=".55"/>
          <g transform="translate(-.8 -15.5)">
            <g class="mx-cycle mx-middle">
              <path d="M-21.6 1.4.7-21.8 23.9 2.5 11.4 2.2l-9.6 3.2L-7.5 1.6Z" fill="#263f37" opacity=".28"/>
              <use xlink:href="#mx-waist" fill="url(#mx-paper)" stroke="#2b4c40" stroke-width="1.9"/>
              <path d="M0-26 .4 3l9.2-3.9 9.1 2.7L17.3-1l6.8.5Q9.6-14.8 0-26Z" fill="url(#mx-fold)"/>
              <use xlink:href="#mx-waist" fill="url(#mx-fibres)"/>
              <path d="m-23.2-1.3 7.5-1-2.2 3.7 9.5-2.7L.6 2.9l8.9-3.8 9.2 2.8m-18.7-25 .5 21.8m-4.8-14.6-8.4 9.9" fill="none" stroke="#d2c486" stroke-width="1"/>
              <path d="M-13-10.6Q-6-4.4 14.4-7.3" stroke="#d8b169" stroke-width="1.2" fill="none"/>
              <use xlink:href="#mx-bauble" x="11" y="-5.6"/><circle cx="-8.7" cy="-6.2" r="1.7" fill="#eecc7a" stroke="#8d6a41" stroke-width=".65"/>
              <g transform="translate(.4 -15.5)">
                <g class="mx-cycle mx-upper">
                  <use xlink:href="#mx-crown-shape" fill="url(#mx-paper)" stroke="#304c3d" stroke-width="1.8"/>
                  <path d="m-.4-22.1.2 21.2 6.3 2.3-.8-2.3 8.6 1Q8.5-5.6 5-11.5l2.4.7Z" fill="url(#mx-fold)"/>
                  <use xlink:href="#mx-crown-shape" fill="url(#mx-fibres)"/>
                  <path d="m-14.1-.8 6.5-.8-1.4 2.3 8.6-2.1 6.8 2.5m-6.8-21L-.2-3.5" fill="none" stroke="#e4ce8c" stroke-width=".95"/>
                  <path d="M-8.5-7.6q7 2.7 14.1-1.7" fill="none" stroke="#e9c377" stroke-width="1.05"/>
                  <use xlink:href="#mx-bauble" x="-4" y="-5.4"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
      <g transform="translate(180.6 173.7)">
        <g class="mx-cycle mx-warm" fill="#ffdb83">
          <circle r="13" opacity=".2"/><circle r="10.5" opacity=".23"/>
        </g>
        <g class="mx-cycle mx-tumble">
          <use xlink:href="#mx-star-shape" fill="#efc46f" stroke="#785537" stroke-width="1.7"/>
          <path d="M0 .3v-8.4l2.4 5-2.4 3.4 8.1-2.7-4.2 4L0 .3l5 7.2L0 5Z" fill="#c88d45"/>
          <path d="M0 .3-8.2-2.4l5.6-.7L0 .3l-4.7 6.8.7-5.6Z" fill="#fbdf93"/>
          <path d="m0-8.1.1 8.6 5.1 6.9M.1.5l7.8-2.9" fill="none" stroke="#ffecaf" stroke-width=".75"/>
          <path d="m-1.6-4.6.7-1.4m4.4 9.5.4.7" stroke="#fff2c6" stroke-width=".65"/>
        </g>
        <g class="mx-cycle mx-flash" fill="none" stroke="#fae7a1" stroke-width="1.5">
          <path d="m-10.9-9.6-3.4-2.3m9.8-.2-1.4-3.2m17 8.6 3.2-1.1m-25.5 6.2-4.3.4"/>
        </g>
      </g>
    </g>
  </g>
</svg>
